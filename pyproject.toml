[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drunkenbot-inference"
version = "0.1.0"
description = "Standalone inference engine and UI components for DrunkenBot LLM models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DrunkenBot AI Team"}
]
dependencies = [
    "torch>=2.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
llama = [
    "llama-cpp-python>=0.2.0",
]
ui = [
    "PySide6>=6.5.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]
all = [
    "llama-cpp-python>=0.2.0",
    "PySide6>=6.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["inference*"]
